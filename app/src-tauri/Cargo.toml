[package]
name = "zorrilho"
version = "0.1.0"
description = "Clonagem de voz local com denoising HushMic"
authors = ["zens"]
license = "Apache-2.0"
repository = "https://github.com/ens-Emilio/zorrilho"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zorrilho_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
hushmic-denoiser = { git = "https://github.com/Fovty/hushmic", version = "0.10.3", features = ["native"] }
cpal = "0.18.2"
hound = "3.5.1"
parking_lot = "0.12.5"
dirs = "7.0.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
tokio = "1.53.3"
