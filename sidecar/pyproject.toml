[project]
name = "zorrilho-sidecar"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "coqui-tts==0.25.3",
    "transformers==4.46.1",
    "torchaudio==2.5.0",
