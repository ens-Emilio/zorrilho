[project]
license = { text = "Apache-2.0" }
name = "zorrilho-sidecar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "coqui-tts==0.25.3",
    "transformers>=4.46",
    "torchaudio>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "soundfile>=0.12",
    "dpdfnet==0.5.1",
    "websockets>=12.0",
    "faster-whisper>=1.0",
]
[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyinstaller>=6.22.3",
]
